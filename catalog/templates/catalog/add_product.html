{% extends 'base.html' %}

{% block title %}Додати автозапчастину | Склад{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <div class="form-header">
            <h2>➕ Додавання нової автозапчастини</h2>
            <p class="form-subtitle">Заповніть інформацію про товар для внесення у складську базу даних</p>
        </div>

        <form method="post" action="{% url 'add_product' %}" class="product-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_name">Назва деталі: <span class="required">*</span></label>
                <input type="text" id="id_name" name="name" class="form-control"
                       placeholder="наприклад: Гальмівні колодки, Фільтр масла"
                       value="{{ form_data.name|default:'' }}" required autofocus>
                <small class="form-text">Введіть повну назву запчастини або вузла</small>
            </div>

            <div class="form-row">
                <div class="form-group col">
                    <label for="id_vehicle_brand">Марка автомобіля: <span class="required">*</span></label>
                    <input type="text" id="id_vehicle_brand" name="vehicle_brand" class="form-control"
                           placeholder="наприклад: Toyota, BMW, Volkswagen"
                           value="{{ form_data.vehicle_brand|default:'' }}" required>
                </div>

                <div class="form-group col">
                    <label for="id_part_number">Номер деталі (Part Number): <span class="required">*</span></label>
                    <input type="text" id="id_part_number" name="part_number" class="form-control"
                           placeholder="наприклад: TY-BP-2040, 04465-33471"
                           value="{{ form_data.part_number|default:'' }}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group col">
                    <label for="id_origin_country">Країна походження: <span class="required">*</span></label>
                    <input type="text" id="id_origin_country" name="origin_country" class="form-control"
                           placeholder="наприклад: Japan, Germany, USA"
                           value="{{ form_data.origin_country|default:'' }}" required>
                </div>

                <div class="form-group col">
                    <label for="id_price">Ціна (грн): <span class="required">*</span></label>
                    <input type="number" id="id_price" name="price" step="0.01" min="0.01" class="form-control"
                           placeholder="наприклад: 1350.50"
                           value="{{ form_data.price|default:'' }}" required>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-submit">💾 Зберегти товар</button>
                <a href="{% url 'products_list' %}" class="btn btn-secondary">Скасувати</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
